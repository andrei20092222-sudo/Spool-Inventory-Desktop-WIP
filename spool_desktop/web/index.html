<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spool Inventory</title>
<meta name="spool-version" content="__VERSION__">
<link rel="icon" href="/static/icon.png">
<style>
  :root {
    --primary-color: #03a9f4; --text-primary-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272;
    --primary-background-color: #fafafa; --secondary-background-color: #e5e5e5; --card-background-color: #fff;
    --divider-color: rgba(0,0,0,.12); --error-color: #db4437; --warning-color: #f5a623;
    --app-header-background-color: #03a9f4; --app-header-text-color: #fff;
    --ha-card-box-shadow: 0 2px 4px rgba(0,0,0,.2); --paper-font-body: system-ui, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --primary-background-color: #111;
      --secondary-background-color: #282828; --card-background-color: #1c1c1c; --divider-color: rgba(255,255,255,.12);
      --app-header-background-color: #1c1c1c; color-scheme: dark;
    }
  }
  html, body { margin: 0; background: var(--primary-background-color); color: var(--primary-text-color);
    font-family: var(--paper-font-body); }
  #app { min-height: 100vh; }
  #quit { position: fixed; right: 12px; bottom: 12px; z-index: 5; border: 1px solid var(--divider-color);
    background: var(--card-background-color); color: var(--secondary-text-color); border-radius: 16px; padding: 6px 12px;
    cursor: pointer; font: inherit; font-size: 12px; opacity: .8; }
  #quit:hover { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<button id="quit" title="Close the app">Quit app</button>
<script src="/static/panel.js?v=__VERSION__"></script>
<script src="/static/shim.js?v=__VERSION__"></script>
</body>
</html>
